# Experiment configuration
# All hyperparameters and model IDs in one place — change here, affects all scripts

seed: 42

# ── Models ──────────────────────────────────────────────────────────────────
# Verified HuggingFace IDs (April 2026)
# Gemma 4 lineup: E2B (dense), E4B (dense), 26B-A4B (MoE, 4B active), 31B (dense)
# Abliterated models by huihui-ai using remove-refusals-with-transformers
# Note: first 10 layers NOT abliterated — may have residual refusals (relevant to low-rank complication)
models:
  base:
    e2b: google/gemma-4-E2B-it       # ~2B dense | runs on laptop (bfloat16)
    e4b: google/gemma-4-E4B-it       # ~4B dense | runs on laptop (int8)
    26b: google/gemma-4-26B-A4B-it   # ~26B MoE, 4B active | RunPod
    31b: google/gemma-4-31B-it       # ~31B dense | RunPod

  abliterated:
    e2b: huihui-ai/Huihui-gemma-4-E2B-it-abliterated    # verified ✓
    e4b: huihui-ai/Huihui-gemma-4-E4B-it-abliterated    # verified ✓
    26b: huihui-ai/Huihui-gemma-4-26B-A4B-it-abliterated # verified ✓
    31b: huihui-ai/Huihui-gemma-4-31B-it-abliterated     # verified ✓

# ── Hardware config per model size ──────────────────────────────────────────
hardware:
  e2b:
    dtype: bfloat16
    device_map: auto
    load_in_8bit: false
    load_in_4bit: true    # E2B ~7.5GB bfloat16, OOMs on 8GB — 4-bit (~2GB VRAM)
  e4b:
    dtype: float16
    device_map: auto
    load_in_8bit: false
    load_in_4bit: true    # E4B bfloat16 = 8GB, OOMs with KV cache — 4-bit (~3GB VRAM)

  26b:
    dtype: bfloat16
    device_map: auto
    load_in_8bit: false
    load_in_4bit: true    # MoE 26B total weights — 4-bit on RunPod 4090 (~13GB)
  31b:
    dtype: bfloat16
    device_map: auto
    load_in_8bit: false
    load_in_4bit: true    # 31B dense bfloat16 = 62GB — 4-bit on RunPod 4090 (~16GB)

# ── Dataset ─────────────────────────────────────────────────────────────────
# Primary: PKU-Alignment/BeaverTails (public, no approval needed)
# Full study: allenai/wildguardmix (gated — request access at hf.co/datasets/allenai/wildguardmix)
dataset:
  source: PKU-Alignment/BeaverTails
  split: 30k_test         # 3,020 rows
  n_prompts: 50           # sample size per language
  harm_filter: is_safe    # filter rows where is_safe == False

# ── Languages ────────────────────────────────────────────────────────────────
languages:
  - en   # English     (high resource, control)
  - es   # Spanish     (high resource)
  - zh   # Chinese     (high resource)
  - pt   # Portuguese  (high resource)
  - ar   # Arabic      (medium resource)
  - hi   # Hindi       (medium/low resource)

# ── Inference ────────────────────────────────────────────────────────────────
inference:
  max_new_tokens: 512     # full response — required for Gemma 4 delayed refusal detection
  do_sample: false        # greedy decoding — reproducible
  batch_size: 1           # safe default; increase if VRAM allows

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  judge_model: claude-haiku-4-5-20251001
  judge_max_tokens: 10

# ── Mechanistic analysis ─────────────────────────────────────────────────────
mechanistic:
  layer_idx: -1           # last layer for refusal direction extraction
  n_components_pca: 2
